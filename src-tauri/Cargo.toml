[package]
name = "plynk-desktop"
version = "1.0.0"
description = "Plynk - Offline-First Brutalist Kanban Desktop Workspace"
authors = ["TrisH0x2A"]
license = "MIT"
repository = "https://github.com/TrisH0x2A/plynk"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = false
codegen-units = 1
debug = 1

[profile.dev.build-override]
codegen-units = 1
incremental = false
debug = 0

[profile.release]
codegen-units = 1
